name: CI

# Cổng kiểm tra: build + test toàn monorepo trên mỗi push và pull request.
# Khớp doc 23 (repo-structure-devflow): CI chạy build + test; doc 22 (test-validation-plan).
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# Huỷ lần chạy cũ khi có commit mới trên cùng ref (tiết kiệm runner).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build (tsc toàn workspace)
        run: pnpm build

      - name: Test (vitest toàn workspace)
        run: pnpm test
