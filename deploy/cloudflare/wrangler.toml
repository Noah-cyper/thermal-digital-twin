# Wrangler config cho Worker chen digital twin vào subpath (tuỳ chọn — có thể set route trong dashboard).
# Deploy:  cd deploy/cloudflare && npx wrangler deploy
# Cần: đã đăng nhập wrangler (npx wrangler login) và zone hoantrantdh.com nằm trong tài khoản.
name = "digital-twin-factory"
main = "worker.js"
compatibility_date = "2024-11-01"

# Gắn Worker vào ĐÚNG path /digital-twin-factory* của zone hoantrantdh.com.
# Site chính (mọi path khác) không bị ảnh hưởng.
routes = [
  { pattern = "hoantrantdh.com/digital-twin-factory*", zone_name = "hoantrantdh.com" }
]
