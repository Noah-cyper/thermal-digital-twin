# IDTP — hạ tầng bền hoá (doc 15/16/19): TimescaleDB (Historian production) + Mosquitto (Sparkplug B).
# Dev/on-prem: `docker compose up -d`. Bật persistence bằng env (xem docs/26-persistence-sparkplug.md):
#   IDTP_TIMESCALE_URL=postgres://idtp:idtp@localhost:5432/idtp \
#   IDTP_MQTT_URL=mqtt://localhost:1883 \
#   pnpm --filter @idtp/app-thermal-runtime serve
services:
  timescale:
    image: timescale/timescaledb:2.17.2-pg16 # extension timescaledb nạp sẵn → create_hypertable chạy được
    container_name: idtp-timescale
    environment:
      POSTGRES_DB: idtp
      POSTGRES_USER: idtp
      POSTGRES_PASSWORD: idtp
    ports:
      - "5432:5432"
    volumes:
      - idtp_timescale:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idtp -d idtp"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: idtp-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  idtp_timescale:
