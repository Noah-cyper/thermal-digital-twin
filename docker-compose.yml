# IDTP — hạ tầng bền hoá (doc 15/19). TimescaleDB cho Historian production (TimescaleHistorian).
# Dev/on-prem: `docker compose up -d timescale`. Ứng dụng cấp SqlExecutor (node-postgres) trỏ vào.
services:
  timescale:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: idtp-timescale
    environment:
      POSTGRES_DB: idtp
      POSTGRES_USER: idtp
      POSTGRES_PASSWORD: idtp
    ports:
      - "5432:5432"
    volumes:
      - idtp_timescale:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idtp -d idtp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  idtp_timescale:
